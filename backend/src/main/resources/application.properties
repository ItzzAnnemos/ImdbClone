spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]
spring.profiles.active=dev,jwt
server.port=${PORT:8080}
jwt.secret=${JWT_SECRET:}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

# --- TMDB catalogue import ---
# Enabled by default for this student project. Put the v4 Read Access Token in
# backend/.env as TMDB_API_TOKEN; never commit real TMDB credentials.
tmdb.enabled=${TMDB_ENABLED:true}
tmdb.api-token=${TMDB_API_TOKEN:}
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p/w500
tmdb.pages=${TMDB_PAGES:25}
tmdb.max-movies=${TMDB_MAX_MOVIES:500}
tmdb.max-tv-series=${TMDB_MAX_TV_SERIES:300}
tmdb.discovery-sorts=${TMDB_DISCOVERY_SORTS:popularity.desc,vote_average.desc,vote_count.desc,primary_release_date.desc}
tmdb.tv-discovery-sorts=${TMDB_TV_DISCOVERY_SORTS:popularity.desc,vote_average.desc,vote_count.desc,first_air_date.desc}
tmdb.minimum-vote-count=${TMDB_MINIMUM_VOTE_COUNT:200}
tmdb.max-cast=${TMDB_MAX_CAST:10}
