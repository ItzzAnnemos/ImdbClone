# PostgreSQL database used by the local Docker Compose setup.
spring.datasource.url=${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:2345/imdb_clone_app}
spring.datasource.username=${POSTGRES_USER:imdb}
spring.datasource.password=${POSTGRES_PASSWORD:imdb}
spring.datasource.driver-class-name=org.postgresql.Driver

# Keep the Docker volume persistent while allowing entity-driven local schema updates.
spring.jpa.hibernate.ddl-auto=update
