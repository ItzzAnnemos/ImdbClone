services:
  postgres:
    image: postgres:17.4
    container_name: imdbclone-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-imdb}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-imdb}
      POSTGRES_DB: ${POSTGRES_DB:-imdb_clone_app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-2345}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
