spring.profiles.active=dev,jwt
jwt.secret=${JWT_SECRET:}

# --- TMDB movie import (optional, disabled by default) ---
# To use: set tmdb.enabled=true and provide your TMDB v4 Read Access Token.
# Get a free token at https://www.themoviedb.org -> Settings -> API.
tmdb.enabled=${TMDB_ENABLED:false}
tmdb.api-token=${TMDB_API_TOKEN:}
tmdb.base-url=https://api.themoviedb.org/3
tmdb.image-base-url=https://image.tmdb.org/t/p/w500
tmdb.pages=${TMDB_PAGES:5}
tmdb.max-cast=${TMDB_MAX_CAST:8}
